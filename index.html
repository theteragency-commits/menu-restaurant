<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>RJ Splash Lounge — Menu</title>
  <meta name="description" content="Carte du restaurant et des cocktails du RJ Splash Lounge.">
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">
    <!-- Colonne latérale (ordinateur) / barre du haut (téléphone) -->
    <aside class="cote">
      <div class="marque">
        <img class="marque-logo" id="logo" alt="" width="44" height="44">
        <div class="marque-texte">
          <p class="marque-nom" id="nom"></p>
          <p class="marque-sous" id="accroche"></p>
        </div>
        <a class="wa-mini" id="wa-mini" target="_blank" rel="noopener" hidden aria-label="Commander sur WhatsApp">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.6-5.2A8.5 8.5 0 1 1 21 11.5Z"/></svg>
        </a>
      </div>

      <div class="bascule" id="bascule" role="tablist" aria-label="Carte"></div>

      <nav class="nav" id="nav" aria-label="Catégories"></nav>

      <div class="cote-pied">
        <a class="btn-wa" id="wa" target="_blank" rel="noopener" hidden>Commander sur WhatsApp</a>
        <p class="cote-mention">Prix en <span id="devise"></span></p>
      </div>
    </aside>

    <main class="contenu">
      <h1 class="sr-only" id="titre-page"></h1>
      <label class="recherche">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="recherche" type="search" placeholder="Rechercher un plat, un cocktail…" aria-label="Rechercher">
      </label>
      <div id="categories" class="categories"></div>
      <p id="vide" class="vide" hidden>Rien ne correspond à ta recherche.</p>
      <footer class="pied">
        <p class="pied-slogan" id="slogan"></p>
        <p>&copy; <span id="annee"></span> <span id="pied-nom"></span> · Prix susceptibles de changer.</p>
      </footer>
    </main>
  </div>

  <script src="menu.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
