<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff6f5">
  <title>RJ Splash Lounge — Menu</title>
  <meta name="description" content="Carte du restaurant et des cocktails du RJ Splash Lounge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar wrap">
    <a class="logo" href="#" aria-label="Accueil">
      <span class="logo-rond" id="logo-rj"></span>
      <span class="logo-nom" id="logo-nom"></span>
    </a>
    <nav class="liens">
      <a href="#menu">Menu</a>
      <a href="#formules">Formules</a>
      <a href="#" id="lien-wa" hidden>WhatsApp</a>
    </nav>
  </header>

  <section class="hero wrap">
    <p class="mot-fond" id="mot-fond" aria-hidden="true"></p>
    <div class="hero-illu" id="hero-illu" aria-hidden="true"></div>
    <h1 class="sr-only" id="titre-page"></h1>
    <p class="accroche" id="accroche"></p>
    <div class="boutons">
      <a class="btn btn-plein" id="btn-hero-1" href="#menu">Voir le menu</a>
      <a class="btn btn-contour" id="btn-hero-2" href="#menu">Les cocktails</a>
    </div>
  </section>

  <section class="wrap" id="menu">
    <div class="barre-cat" id="barre-cat" role="tablist" aria-label="Catégories"></div>
    <div class="grille-tete">
      <h2 class="titre-display" id="cat-titre"></h2>
      <span class="horaires" id="cat-horaires" hidden></span>
    </div>
    <ul class="grille" id="grille"></ul>
  </section>

  <section class="wrap offres" id="formules">
    <div class="offres-tete">
      <h2 class="titre-display" id="offres-titre"></h2>
      <div class="pagination" id="pagination"></div>
    </div>
    <div class="carrousel" id="carrousel"></div>
  </section>

  <section class="wrap atouts" id="atouts"></section>

  <section class="wrap">
    <div class="appel">
      <h2 class="titre-display" id="appel-titre"></h2>
      <p id="appel-texte"></p>
      <div class="boutons" id="appel-boutons"></div>
    </div>
  </section>

  <footer class="wrap footer">
    <p>&copy; <span id="annee"></span> <span id="footer-nom"></span></p>
    <p class="footer-slogan" id="footer-slogan"></p>
    <p class="footer-mention">Prix en <span id="devise"></span>, susceptibles de changer.</p>
  </footer>

  <script src="menu.js"></script>
  <script src="illustrations.js"></script>
  <script src="app.js"></script>
</body>
</html>
